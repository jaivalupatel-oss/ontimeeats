name: CI/CD — OnTimeEats

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # needed to push to GitHub Container Registry

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Lint & Test
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: Lint & Test (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ── Create a tiny stub model so tests don't need the real 600 MB file ──
      - name: Create stub model for CI
        run: |
          python - <<'EOF'
          import joblib, json
          from pathlib import Path
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler
          from sklearn.dummy import DummyRegressor

          stub = Pipeline([("scaler", StandardScaler()), ("reg", DummyRegressor(strategy="mean"))])
          import numpy as np
          stub.fit(np.zeros((1, 1)), [0])

          Path("models").mkdir(exist_ok=True)
          joblib.dump(stub, "models/random_forest_regressor.joblib")

          meta = {
            "model_name": "RandomForestRegressor",
            "mae": 0.27, "rmse": 0.39, "r2": 0.9954,
            "mse": 0.15, "median_ae": 0.20, "explained_variance": 0.995,
            "n_features": 38, "n_estimators": 200,
            "train_records": 160000, "test_records": 40000
          }
          Path("models/model_artifacts.json").write_text(json.dumps(meta, indent=2))
          print("Stub model created successfully.")
          EOF

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker image (only on pushes to main)
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
