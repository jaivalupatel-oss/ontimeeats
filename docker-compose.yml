services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: food-delivery-delay-prediction:local
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
